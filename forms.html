<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <form >

        <input type="number" placeholder="age"> <hr>
        <label for="">Birth Time</label>
        <input type="time"><br>
        <label for="">DOB:</label>
        <input type="date" min="2026-01-05" max="2026-08-15"> <hr>


        <button type="submit">Register</button>


    </form>
    <hr>
    <form >

        <input  name = "gender" type="radio" id="m"> <label for="">Male</label>
        <input name ="gender" type="radio" id="f"> <label for="">Female</label>
        <input name ="gender" type="radio" id="o"> <label for="">Others</label>
        <hr>
        <label for="">Skills:</label>
        <input type="checkbox"> <label for="">Java</label>
        <input type="checkbox"> <label for="">Reactjs</label>
        <input type="checkbox"> <label for="">MongoDb</label>
        <input type="checkbox"> <label for="">Python</label>
        <hr>
        <textarea placeholder="=Address" cols="40px" rows="10px"></textarea>
    </form>
    
</body>
</html>
